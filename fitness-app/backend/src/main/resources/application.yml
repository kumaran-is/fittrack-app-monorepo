spring:
  r2dbc:
    url: r2dbc:h2:mem:///fitnessdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-in-prod-min32chars!}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}

server:
  port: 8080

logging:
  level:
    com.fitness: DEBUG
    org.springframework.r2dbc: INFO
    io.r2dbc: INFO
